name: Update discussion feed

on:
  discussion:
  discussion_comment:
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: ama-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/checkout@v6
        with:
          ref: ama-data
          path: feed
      - name: Export discussions
        run: node scripts/export-ama.mjs feed/ama.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Update public feed
        working-directory: feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ama.json
          if ! git diff --cached --quiet; then
            git commit -m "Update discussion feed"
            git push origin HEAD:ama-data
          fi
